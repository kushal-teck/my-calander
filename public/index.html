*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}

.dhead{display:flex;align-items:center;gap:12px;padding:4px 8px 16px;margin-bottom:6px;border-bottom:1px solid var(--line)}

.ditem.on svg{stroke:#fff}
.dsp{flex:1;min-height:12px}

#bell.on::after{content:"ON";margin-left:auto;font-size:11px;font-weight:800;letter-spacing:.5px;color:#06281c;background:var(--grn);border-radius:8px;padding:2px 7px}
#pill{display:flex;align-items:center;gap:4px;border-radius:999px;padding:5px}

#body{flex:1;overflow:auto;padding:2px 2px 16px}
.wk,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.wk div{text-align:center;color:var(--mut);padding:4px 0 8px;font-size:13px;font-weight:600}
.wk div:first-child,.sun{color:var(--red)!important}
.cell{min-height:92px;border-radius:18px;padding:10px;position:relative;cursor:pointer;background:var(--glass);border:1px solid var(--line);transition:transform .15s,background .2s}

.cell.blank{background:none;border:0;pointer-events:none}
.add{flex-wrap:wrap}dialog .add input{flex:1 1 100%}

.cell.done{background:linear-gradient(145deg,rgba(46,230,160,.32),rgba(46,230,160,.12));border-color:rgba(46,230,160,.7)}

.mini{border-radius:20px;padding:14px}

.alt{color:var(--mut);font-size:14px}.alt a{color:#fff;font-weight:700;cursor:pointer;text-decoration:underline}
#gbtn{display:flex;justify-content:center;min-height:0}

const b64=s=>{const r=atob((s+"=".repeat((4-s.length%4)%4)).replace(/-/g,"+").replace(/_/g,"/"));return Uint8Array.from(r,c=>c.charCodeAt(0))};

function refreshBell(){const bb=document.querySelector("#bell");if(!bb||!navigator.serviceWorker)return;

async function ensureAlerts(manual){
 if(!("serviceWorker" in navigator)||!("PushManager" in window)||!("Notification" in window)||!vapid||!tok)return false;
 if(!manual&&localStorage.getItem("cal_alerts_off"))return false;
 let perm=Notification.permission;
 if(perm==="default")perm=await Notification.requestPermission();
 if(perm!=="granted")return false;
 try{const reg=await navigator.serviceWorker.register("/sw.js");await navigator.serviceWorker.ready;
  let sub=await reg.pushManager.getSubscription();
  if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64(vapid)});
  await fetch("/api/push",{method:"POST",headers:H(),body:JSON.stringify({sub:sub.toJSON(),tz:Intl.DateTimeFormat().resolvedOptions().timeZone})});
  localStorage.removeItem("cal_alerts_off");refreshBell();return true}catch(e){return false}}

 i.onchange=()=>{const f=i.files[0];if(!f)return res();
  if(f.size>900*1024){ask("This sound file is too large. Please choose a file under 900 KB.",OK).then(res);return}
  const r=new FileReader();r.onload=()=>{try{localStorage.setItem("cal_sound",r.result);playSound()}catch(e){ask("Could not save this sound.",OK)}res()};r.readAsDataURL(f)};

async function alertsMenu(){
 if(!("serviceWorker" in navigator)||!("PushManager" in window))return ask("Notifications are not supported here. On iPhone, add this site to your Home Screen first, then open it from there.",OK);
 if(!vapid)return ask("Reminders are not set up on the server yet.",OK);
 for(;;){
  const on=await hasSub(),snd=!!localStorage.getItem("cal_sound");
  const o=[{t:on?"Turn off":"Turn on",v:"t",c:on?"r":"y"},{t:snd?"Change sound":"Choose sound",v:"c",c:"g"}];
  if(snd)o.push({t:"Play sound",v:"p",c:"g"},{t:"Reset sound",v:"r",c:"g"});o.push({t:"Close",v:null,c:"g"});
  const v=await ask(on?"Reminders are ON. You get a notification every 2 hours while today's tasks are not marked Right.":"Reminders are OFF.",o);
  if(v===null)return;

   if(on){const reg=await navigator.serviceWorker.getRegistration(),s=await reg.pushManager.getSubscription();
    await fetch("/api/push",{method:"DELETE",headers:H(),body:JSON.stringify({endpoint:s.endpoint})}).catch(()=>{});await s.unsubscribe();localStorage.setItem("cal_alerts_off","1");refreshBell()}
   else if(!(await ensureAlerts(true)))await ask("Could not turn on reminders. Please allow notifications for this site in your browser settings.",OK)}

const TL_D={};for(const k in TL_RAW)TL_D[k.normalize("NFD")]=TL_RAW[k];
const TL_C={"क":"k","ख":"kh","ग":"g","घ":"gh","ङ":"n","च":"ch","छ":"chh","ज":"j","झ":"jh","ञ":"n","ट":"t","ठ":"th","ड":"d","ढ":"dh","ण":"n","त":"t","थ":"th","द":"d","ध":"dh","न":"n","प":"p","फ":"ph","ब":"b","भ":"bh","म":"m","य":"y","र":"r","ल":"l","ळ":"l","व":"v","श":"sh","ष":"sh","स":"s","ह":"h"};
const TL_N={"क":"q","ख":"kh","ग":"g","ज":"z","ड":"r","ढ":"rh","फ":"f"};
const TL_V={"अ":"a","आ":"aa","इ":"i","ई":"i","उ":"u","ऊ":"u","ऋ":"ri","ए":"e","ऐ":"ai","ओ":"o","औ":"au","ऑ":"o","ऍ":"e"};
const TL_M={"ा":"a","ि":"i","ी":"i","ु":"u","ू":"u","ृ":"ri","े":"e","ै":"ai","ो":"o","ौ":"au","ॉ":"o","ॅ":"e"};
function tlWord(w){
 w=w.normalize("NFD").replace(/ज्ञ/g,"ग्य");
 const L=tlLook(w);if(L)return L;
 const T=[];let i=0;
 while(i<w.length){const ch=w[i];
  if(TL_C[ch]){let r=TL_C[ch];i++;
   if(w[i]==="़"){r=TL_N[ch]||r;i++}
   const t={c:r,v:null,inh:false};
   if(TL_M[w[i]]){t.v=TL_M[w[i]];i++}else if(w[i]==="्"){i++}else t.inh=true;
   T.push(t)}
  else if(TL_V[ch]){T.push({c:"",v:TL_V[ch],inh:false});i++}
  else if(ch==="ं"||ch==="ँ"){T.push({c:"n",x:1});i++}
  else if(ch==="ः"){T.push({c:"h",x:1});i++}
  else if(ch>="०"&&ch<="९"){T.push({c:String(ch.charCodeAt(0)-0x966),x:2});i++}
  else i++}
 const has=t=>!!t&&!t.x&&(t.v!==null?t.v!=="":t.inh);
 let last=-1;for(let j=T.length-1;j>=0;j--)if(!T[j].x){last=j;break}
 for(let j=T.length-1;j>=0;j--){const t=T[j];if(!t.inh)continue;
  if(j===last&&j>0){t.inh=false;continue}
  if(j>0&&j<last&&has(T[j-1])&&has(T[j+1]))t.inh=false}
 let out="";
 T.forEach((t,j)=>{
  if(t.x===1&&t.c==="n"){const nx=T[j+1];out+=nx&&/^(p|b|m)/.test(nx.c||"")?"m":"n";return}
  if(t.x){out+=t.c;return}
  out+=t.c+(t.v!==null?t.v:(t.inh?"a":""))});
 return out}

const TL_S={};
function tlSk(w){
 w=w.normalize("NFD").replace(/\s+/g,"");
 w=w.replace(/[डढ]़/g,"र").replace(/[ऀ-ॿ]/g,c=>({"़":"","ं":"","ँ":"","ः":"","्":"","ी":"ि","ू":"ु","ै":"े","ौ":"ो","ॉ":"ो","ॅ":"े","ई":"इ","ऊ":"उ","ऐ":"ए","औ":"ओ","ऑ":"ओ","ऍ":"ए","ड":"र","ढ":"र","र":"र","ट":"त","ठ":"थ","ण":"न","श":"स","ष":"स","ळ":"ल"}[c]??c));
 return w.replace(/(.)\1+/g,"$1")}
(function(){
 const add=(v,r)=>{const e=v.replace(/\s+/g,"").normalize("NFD");if(!(e in TL_D))TL_D[e]=r;const k=tlSk(v);if(k.length>=3&&!(k in TL_S))TL_S[k]=r};
 for(const k in TL_RAW)add(k,TL_RAW[k]);
 TL_EXTRA.split("\n").forEach(l=>{const i=l.indexOf("=");if(i<1)return;const r=l.slice(0,i).trim();l.slice(i+1).split(",").forEach(v=>{v=v.trim();if(v)add(v,r)})})
})();
function tlLook(w){
 const e=w.replace(/\s+/g,"").normalize("NFD");if(TL_D[e])return TL_D[e];
 const k=tlSk(w);return k.length>=3&&TL_S[k]?TL_S[k]:null}
const DEV=/[ऀ-ॿ]/,DEVW=/^[ऀ-ॿ]+$/;
function tlText(s){
 const t=s.trim().split(/\s+/),out=[];
 for(let i=0;i<t.length;){
  if(DEVW.test(t[i])){
   let hit=null,n=0;
   for(const m of [3,2]){if(i+m<=t.length&&t.slice(i,i+m).every(x=>DEVW.test(x))){const L=tlLook(t.slice(i,i+m).join(""));if(L){hit=L;n=m;break}}}
   if(hit){out.push(hit);i+=n;continue}}
  out.push(DEV.test(t[i])?t[i].replace(/[ऀ-ॿ]+/g,tlWord):t[i]);i++}
 return out.join(" ").replace(/\s+/g," ").trim()}
function tlScore(s){return s.trim().split(/\s+/).filter(x=>DEVW.test(x)&&tlLook(x)).length}
function tlPick(res){let best=res[0].transcript,sc=-1;for(let j=0;j<res.length;j++){const c=tlScore(res[j].transcript);if(c>sc){sc=c;best=res[j].transcript}}return best}
/*/TL*/
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null;
function stopListen(){if(rec){rec._x=1;try{rec.abort()}catch(e){}rec=null}}
function listen(btn,input,done){
 if(!SR)return ask("Voice input is not supported in this browser. Please open the site in Chrome (Android or desktop).",OK);
 if(rec){try{rec.stop()}catch(e){}return}
 const r=new SR(),lab=btn.querySelector("span"),old=input.placeholder;let err="";
 rec=r;r.lang="hi-IN";r.interimResults=true;r.continuous=false;r.maxAlternatives=5;
 r.onstart=()=>{btn.classList.add("rec");lab.textContent="Listening… tap to stop";input.value="";input.placeholder="Speak your task now"};
 r.onresult=e=>{let t="";for(let j=0;j<e.results.length;j++)t+=tlPick(e.results[j])+" ";input.value=tlText(t)};
 r.onerror=e=>{err=e.error||"error"};
 r.onend=()=>{if(r._x)return;rec=null;btn.classList.remove("rec");lab.textContent="Speak";input.placeholder=old;
  const txt=input.value.trim();
  if(err==="not-allowed"||err==="service-not-allowed")return ask("Microphone access is blocked. Please allow the microphone for this site in your browser settings, then try again.",OK);
  if(err==="network")return ask("Voice recognition needs an internet connection.",OK);
  if(!txt){if(err==="no-speech"||!err)input.placeholder="Didn't catch that. Tap Speak and try again.";return}
  done(txt.charAt(0).toUpperCase()+txt.slice(1))};
 try{r.start()}catch(e){rec=null}}

function openDay(k){
 const [y,m,d]=k.split("-").map(Number),dt=new Date(y,m-1,d);
 const dlg=el("dialog"),h=el("p","",`${DF[dt.getDay()]}, ${d} ${MN[m-1]} ${y}`);if(dt.getDay()===0)h.className="sun";
 const box=el("div"),c=el("button","g","Close");c.style.marginTop="14px";c.onclick=()=>{dlg.close();dlg.remove()};
 dlg.append(h,box,c);dlg.onclose=()=>{stopListen();dlg.remove()};document.body.append(dlg);taskPanel(box,k);dlg.showModal()}

/* ---- views ---- */
function ring(k){const r=el("button","ring");r.innerHTML=TICK;r.setAttribute("aria-label","Mark day complete");r.onclick=e=>{e.stopPropagation();toggleDone(k)};return r}
function monthView(root){
 const mv=el("div","mview"),w=el("div","wk");DN.forEach(n=>w.append(el("div","",n)));mv.append(w);
 const g=el("div","grid"),y=cur.getFullYear(),m=cur.getMonth(),first=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate();
 for(let i=0;i<first;i++)g.append(el("div","cell blank"));
 for(let d=1;d<=n;d++){const dt=new Date(y,m,d),k=key(dt),c=el("div","cell"+(S.done[k]?" done":"")+(bad(k)?" bad":"")+(k===todayK?" today":""));
  c.tabIndex=0;const ct=el("div","ct");ct.append(el("span","n"+(dt.getDay()===0&&k!==todayK?" sun":""),d),ring(k));c.append(ct);
  const t=(S.tasks[k]||[]).length+consOn(k).length;if(t){const cn=el("span","cnt");cn.innerHTML="<b>"+t+"</b><em> task"+(t>1?"s":"")+"</em>";c.append(cn)}
  c.onclick=()=>openDay(k);c.onkeydown=e=>{if(e.key==="Enter")openDay(k)};g.append(c)}
 const rows=Math.ceil((first+n)/7);for(let i=first+n;i<rows*7;i++)g.append(el("div","cell blank"));
 g.style.setProperty("--rows",rows);
 mv.append(g);root.append(mv)}
function yearView(root){
 const wrap=el("div","year"),y=cur.getFullYear();
 for(let m=0;m<12;m++){const card=el("div","mini glass"),h=el("h4","",MN[m]);h.onclick=()=>{cur=new Date(y,m,1,12);view="month";render()};card.append(h);
  const g=el("div","grid");DN.forEach((n,i)=>g.append(el("span",i===0?"sun":"",n[0])));
  const first=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate();
  for(let i=0;i<first;i++)g.append(el("span"));
  for(let d=1;d<=n;d++){const dt=new Date(y,m,d),k=key(dt),s=el("span",(dt.getDay()===0?"sun ":"")+(S.done[k]?"done ":"")+(bad(k)?"bad":""),d);s.onclick=()=>openDay(k);g.append(s)}
  card.append(g);wrap.append(card)}
 root.append(wrap)}
function dayView(root){
 const k=key(cur),c=el("div","daycard glass"+(S.done[k]?" done":"")+(bad(k)?" bad":"")),h=el("div","dayhead"),t=el("div",cur.getDay()===0?"sun":"",`${cur.getDate()} ${MN[cur.getMonth()]} ${cur.getFullYear()}`);
 t.style.cssText="font-size:22px;font-weight:800";h.append(t,ring(k));
 const box=el("div");c.append(h,box);root.append(c);taskPanel(box,k)}

function render(){
 const b=$("#body");b.innerHTML="";b.classList.toggle("mv",view==="month");
 $("#pill").classList.toggle("cons",view==="cons");
 if(view==="cons"){$("#lbl").textContent="Consistency Tasks";consView(b)}
 else if(view==="year"){$("#lbl").textContent=cur.getFullYear();yearView(b)}
 else if(view==="month"){$("#lbl").textContent=MN[cur.getMonth()]+" "+cur.getFullYear();monthView(b)}
 else{$("#lbl").textContent=`${DF[cur.getDay()]}, ${cur.getDate()} ${MN[cur.getMonth()]} ${cur.getFullYear()}`;dayView(b)}
 document.querySelectorAll("#drawer [data-v]").forEach(x=>x.classList.toggle("on",x.dataset.v===view))}
function step(n){if(view==="cons")return;if(view==="year")cur.setFullYear(cur.getFullYear()+n);else if(view==="month"){cur.setDate(1);cur.setMonth(cur.getMonth()+n)}else cur.setDate(cur.getDate()+n);render()}
$("#prev").onclick=()=>step(-1);$("#next").onclick=()=>step(1);
