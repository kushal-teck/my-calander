<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>My Calendar</title>
<link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#0a0f1f"><link rel="icon" type="image/png" href="/icon-192.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--glass:rgba(255,255,255,.07);--glass2:rgba(255,255,255,.12);--line:rgba(255,255,255,.12);--mut:#9fb0c8;--red:#ff5a6e;--grn:#2ee6a0;--acc:#7c9cff}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:"Plus Jakarta Sans",system-ui,sans-serif;color:#fff;height:100vh;display:flex;gap:14px;padding:14px;background:radial-gradient(900px 600px at 10% -10%,#27306b 0,transparent 60%),radial-gradient(800px 600px at 110% 110%,#0e5a5a 0,transparent 55%),#0a0f1f}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#top{display:flex;align-items:center;gap:10px;padding:2px 0 14px}
#top .sp2{width:48px;flex:none}
#pill{margin:0 auto}
#menuBtn{width:48px;height:48px;flex:none;border-radius:16px;display:grid;place-items:center;transition:.2s}
#menuBtn:hover{background:var(--glass2)}
#menuBtn svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round}
#drawer{position:fixed;inset:0;z-index:50;pointer-events:none}
#drawer .scrim{position:absolute;inset:0;background:rgba(5,8,18,.62);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;transition:opacity .25s}
#drawer .panel{position:absolute;top:0;bottom:0;left:0;width:min(82vw,300px);display:flex;flex-direction:column;gap:6px;padding:max(18px,env(safe-area-inset-top)) 14px max(18px,env(safe-area-inset-bottom));background:rgba(16,23,46,.97);border-right:1px solid var(--line);border-radius:0 28px 28px 0;box-shadow:20px 0 60px #0009;transform:translateX(-104%);transition:transform .28s cubic-bezier(.2,.8,.2,1);overflow-y:auto}
#drawer.open{pointer-events:auto}
#drawer.open .scrim{opacity:1}
#drawer.open .panel{transform:none}
.dhead{display:flex;align-items:center;gap:12px;padding:4px 8px 16px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.dhead .logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#6f8cff,#9b6bff);box-shadow:0 8px 20px #6f8cff55}
.dhead .logo svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dhead b{font-size:18px;font-weight:800}
.dhead small{display:block;color:var(--mut);font-size:12px;font-weight:500;margin-top:2px}
.ditem{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;border-radius:16px;font-size:15.5px;font-weight:600;color:var(--mut);text-align:left;transition:.2s}
.ditem:hover{background:var(--glass2);color:#fff}
.ditem.on{background:linear-gradient(135deg,#6f8cff,#9b6bff);color:#fff;box-shadow:0 8px 20px #6f8cff55}
.ditem svg{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ditem.on svg{stroke:#fff}
.dsp{flex:1;min-height:12px}
.dsep{height:1px;background:var(--line);margin:6px 8px}
#bell.on{background:none;box-shadow:none;color:var(--mut)}
#bell.on:hover{background:var(--glass2);color:#fff}
#bell.on svg{stroke:currentColor}
#bell.on::after{content:"ON";margin-left:auto;font-size:11px;font-weight:800;letter-spacing:.5px;color:#06281c;background:var(--grn);border-radius:8px;padding:2px 7px}
#pill{display:flex;align-items:center;gap:4px;border-radius:999px;padding:5px}
#pill button{width:40px;height:40px;border-radius:50%;font-size:22px;color:var(--mut);transition:.2s}
#pill button:hover{background:var(--glass2);color:#fff}
#lbl{min-width:200px;text-align:center;font-weight:700;font-size:16px;padding:0 10px}
#body{flex:1;overflow:auto;padding:2px 2px 16px}
.wk,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.wk div{text-align:center;color:var(--mut);padding:4px 0 8px;font-size:13px;font-weight:600}
.wk div:first-child,.sun{color:var(--red)!important}
.cell{min-height:92px;border-radius:18px;padding:10px;position:relative;cursor:pointer;background:var(--glass);border:1px solid var(--line);transition:transform .15s,background .2s}
.cell:hover{transform:translateY(-2px);background:var(--glass2)}
.cell.blank{background:none;border:0;pointer-events:none}
.add{flex-wrap:wrap}dialog .add input{flex:1 1 100%}
.add .mic,.add .addb{flex:1 1 0;display:flex;align-items:center;justify-content:center;gap:8px}
.add .mic{background:var(--glass2);border:1px solid var(--line)}
.add .mic svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.add .mic.rec{background:var(--red);border-color:var(--red);animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,90,110,.6)}100%{box-shadow:0 0 0 14px rgba(255,90,110,0)}}
.cell .n{font-size:16px;font-weight:700;display:inline-block;min-width:28px;text-align:center;padding:2px 0;border-radius:10px}
.cell.today .n{background:#fff;color:#0a0f1f}
.cell.done{background:linear-gradient(145deg,rgba(46,230,160,.32),rgba(46,230,160,.12));border-color:rgba(46,230,160,.7)}
.cell.bad{background:linear-gradient(145deg,rgba(255,90,110,.40),rgba(255,90,110,.14));border-color:rgba(255,90,110,.8)}
.cell .cnt{position:absolute;left:12px;bottom:9px;font-size:11px;font-weight:600;color:var(--mut)}
.ring{position:absolute;top:9px;right:9px;width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,.35);display:grid;place-items:center;transition:.2s}
.ring svg{display:block;width:16px;height:16px;stroke:#06281c;stroke-width:3.2;fill:none;opacity:0;stroke-linecap:round;stroke-linejoin:round}
.ring:hover{border-color:var(--grn)}
.done .ring{background:var(--grn);border-color:var(--grn)}.done .ring svg{opacity:1}
.year{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.mini{border-radius:20px;padding:14px}
.mini h4{font-size:15px;margin-bottom:8px;cursor:pointer;font-weight:700}
.mini h4:hover{color:var(--acc)}
.mini .grid{gap:3px}
.mini span{font-size:11px;text-align:center;padding:4px 0;border-radius:8px;cursor:pointer;font-weight:500}
.mini span:hover{background:var(--glass2)}
.mini span.done{background:var(--grn);color:#06281c;font-weight:700}
.mini span.bad{background:var(--red);color:#fff;font-weight:700}
.daycard{max-width:580px;margin:0 auto;border-radius:26px;padding:22px}
.daycard.done{border-color:rgba(46,230,160,.7);box-shadow:0 0 0 1px rgba(46,230,160,.3),0 20px 50px rgba(46,230,160,.12)}
.daycard.bad{border-color:rgba(255,90,110,.8);box-shadow:0 0 0 1px rgba(255,90,110,.3),0 20px 50px rgba(255,90,110,.14)}
.dayhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.dayhead .ring{position:static;width:38px;height:38px}.dayhead .ring svg{width:20px;height:20px}
.task{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:8px;border-radius:16px;background:var(--glass);border:1px solid var(--line);transition:.2s}
.task .t{flex:1;word-break:break-word;font-weight:500}
.task.s1{background:rgba(46,230,160,.12);border-color:rgba(46,230,160,.45)}
.task.s1 .t{color:#b9f7de}
.task.s2{background:rgba(255,90,110,.12);border-color:rgba(255,90,110,.45)}.task.s2 .t{color:#ffc2ca;}
.mk{width:38px;height:38px;padding:0;line-height:0;border-radius:50%;border:2px solid rgba(255,255,255,.35);display:grid;place-items:center;transition:.2s;flex:none}
.mk svg{display:block;width:22px;height:22px;fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;opacity:0;stroke:#06281c}
.mk:hover{border-color:var(--grn)}
.mk.on1{background:var(--grn);border-color:var(--grn)}.mk.on1 svg{opacity:1}
.mk.on2{background:var(--red);border-color:var(--red)}.mk.on2 svg{opacity:1;stroke:#fff}
.add{display:flex;gap:8px;margin-top:14px}
.add input{flex:1;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:14px;padding:12px 14px;color:#fff;font:inherit}
.add input::placeholder{color:var(--mut)}
.add button,dialog button{background:linear-gradient(135deg,#6f8cff,#9b6bff);border-radius:14px;padding:11px 18px;font-weight:700}
dialog{margin:auto;background:#141b33;color:#fff;border:1px solid var(--line);border-radius:26px;padding:22px;width:min(92vw,460px);max-height:88vh;overflow:auto;box-shadow:0 30px 80px #000a}
dialog::backdrop{background:rgba(5,8,18,.65);backdrop-filter:blur(4px)}
dialog p{margin-bottom:16px;font-weight:600;line-height:1.4}
dialog .row{display:flex;gap:8px;flex-wrap:wrap}
dialog button.y{background:var(--grn);color:#06281c}dialog button.r{background:var(--red)}dialog button.g{background:var(--glass2)}
.empty{color:var(--mut);padding:8px 0 4px;font-size:14px}
#auth{flex:1;display:flex;align-items:center;justify-content:center}
body:not(.out) #auth{display:none}
body.out #drawer,body.out #main{display:none}
.authcard{width:min(92vw,400px);border-radius:28px;padding:30px 26px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.authcard .logo{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(135deg,#6f8cff,#9b6bff);box-shadow:0 10px 26px #6f8cff55}
.authcard .logo svg{width:28px;height:28px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.authcard h1{font-size:24px;font-weight:800}
.authcard .sub{color:var(--mut);font-size:14px;line-height:1.4}
.authcard input{width:100%;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:14px;padding:13px 14px;color:#fff;font:inherit}
.authcard input::placeholder{color:var(--mut)}
.authcard .primary{width:100%;background:linear-gradient(135deg,#6f8cff,#9b6bff);border-radius:14px;padding:13px;font-weight:700}
#err{color:var(--red);font-size:13px}
.alt{color:var(--mut);font-size:14px}.alt a{color:#fff;font-weight:700;cursor:pointer;text-decoration:underline}
#gbtn{display:flex;justify-content:center;min-height:0}
html{-webkit-text-size-adjust:100%}
body{height:100vh;height:100dvh;overflow:hidden}
#main{min-width:0}
#pill{max-width:100%}
#lbl{flex:1;min-width:0;font-size:clamp(12px,3.4vw,16px);line-height:1.25;overflow-wrap:anywhere}
.wk,.grid{grid-template-columns:repeat(7,minmax(0,1fr))}
.cell{min-width:0;padding:6px;min-height:clamp(54px,8vw,100px);overflow:hidden}
.cell .n{font-size:clamp(11px,3.2vw,17px);min-width:0;padding:2px 5px}
.ring{width:clamp(16px,2.6vw,26px);height:clamp(16px,2.6vw,26px);top:6px;right:6px}
.ring svg{width:60%;height:60%}
.cnt{left:6px;bottom:5px;white-space:nowrap}
.cnt em{font-style:normal}
.year{grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr))}
.mini .grid{gap:2px}.mini span{min-width:0}
.task .t{min-width:0}.add input{min-width:0}.add button{flex:none}
dialog{max-height:88vh;max-height:88dvh}
#auth{overflow:auto;padding:12px}
@media(max-width:560px){body{padding:8px;gap:8px}.wk,.grid{gap:5px}.wk div{font-size:11px}.daycard{padding:16px;border-radius:20px}.authcard{padding:24px 18px}#menuBtn,#top .sp2{width:44px}#menuBtn{height:44px}}
@media(max-width:360px){.mk{width:34px;height:34px}.task{padding:10px}}
@media(max-height:520px){#top{padding-bottom:8px}.authcard{padding:18px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.cell{display:flex;flex-direction:column;justify-content:space-between;gap:3px;padding:clamp(3px,1.1vw,10px);min-height:clamp(50px,9vw,100px);min-width:0;overflow:hidden}
.ct{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:3px;min-width:0}
.cell .n{font-size:clamp(10px,2.8vw,17px);line-height:1.3;padding:1px 5px;min-width:0}
.ring{position:static;top:auto;right:auto;flex:none;width:clamp(15px,2.4vw,26px);height:clamp(15px,2.4vw,26px)}
.cell .cnt{position:static;font-size:clamp(9px,2.1vw,11px);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cnt em{font-style:normal}
.cnt b{background:var(--glass2);border-radius:8px;padding:1px 6px}
@media(max-width:560px){.cnt em{display:none}}
@media(max-width:480px){.ct{flex-direction:column;align-items:center}.cell .n{display:block;text-align:center}.cell .cnt{text-align:center}}
#body{display:flex;flex-direction:column}
#main{min-height:0}
.mview{flex:1 1 auto;min-height:380px;display:flex;flex-direction:column}
#body.mv{padding-bottom:2px}
.mview .wk{flex:none}
.mview .grid{flex:1;min-height:0;grid-template-rows:repeat(var(--rows,6),minmax(0,1fr));gap:8px}
.mview .cell{min-height:0;border-radius:18px;background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.14);box-shadow:0 8px 20px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.10)}
.mview .cell:hover{transform:translateY(-2px);background:linear-gradient(160deg,rgba(255,255,255,.18),rgba(255,255,255,.07))}
.mview .cell.done{background:linear-gradient(145deg,rgba(46,230,160,.34),rgba(46,230,160,.12));border-color:rgba(46,230,160,.7)}
.mview .cell.bad{background:linear-gradient(145deg,rgba(255,90,110,.42),rgba(255,90,110,.14));border-color:rgba(255,90,110,.8)}
.mview .cell.today{box-shadow:0 0 0 2px rgba(124,156,255,.9),0 8px 20px rgba(0,0,0,.18)}
.mview .cell.blank{background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.05);box-shadow:none;pointer-events:none}
@media(max-width:560px){.mview .grid{gap:5px}.mview .cell{border-radius:12px}}
.daycard{width:100%}
body{padding-top:max(14px,env(safe-area-inset-top));padding-bottom:max(14px,env(safe-area-inset-bottom))}
@media(max-width:560px){body{padding-top:max(8px,env(safe-area-inset-top));padding-bottom:max(8px,env(safe-area-inset-bottom))}}
</style>
</head>
<body class="out">
<div id="auth"></div>
<div id="drawer"><div class="scrim"></div><nav class="panel"></nav></div>
<div id="main"><div id="top"><button id="menuBtn" class="glass" aria-label="Open menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><div id="pill" class="glass"><button id="prev" aria-label="Previous">‹</button><div id="lbl"></div><button id="next" aria-label="Next">›</button></div><div class="sp2"></div></div><div id="body"></div></div>
<script>window.onGoogleLibraryLoad=()=>{if(document.body.classList.contains("out"))setupGoogle()}</script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
const MN=["January","February","March","April","May","June","July","August","September","October","November","December"];
const DN=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const DF=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const TICK='<svg viewBox="0 0 24 24"><path d="M6.5 12.5l3.8 3.8 7.2-8"/></svg>';
const CROSS='<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>';
let S={done:{},tasks:{}},view="month",cur=new Date();cur.setHours(12,0,0,0);
const $=s=>document.querySelector(s);
const key=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const bad=k=>(S.tasks[k]||[]).some(t=>t.s!==1);
const todayK=key(new Date());
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}

/* ---- Netlify database (Blobs) + login ---- */
let vapid="",tok=localStorage.getItem("cal_tok"),gid="",loaded=false,timer;
const H=()=>({"Content-Type":"application/json",Authorization:"Bearer "+tok});
function save(){if(!loaded)return;clearTimeout(timer);timer=setTimeout(()=>fetch("/api/data",{method:"PUT",headers:H(),body:JSON.stringify(S)}).then(r=>{if(r.status===401)logout()}).catch(()=>{}),300)}
async function load(){try{const r=await fetch("/api/data",{headers:H()});if(r.status===401)return logout();S=await r.json();loaded=true}catch(e){return logout()}
S.done=S.done||{};S.tasks=S.tasks||{};document.body.classList.remove("out");render();refreshBell();if("Notification" in window&&Notification.permission==="granted")ensureAlerts(false)}
function logout(){const t=tok;
 if(t&&navigator.serviceWorker)navigator.serviceWorker.getRegistration().then(r=>r&&r.pushManager.getSubscription()).then(s=>{if(s){fetch("/api/push",{method:"DELETE",headers:{"Content-Type":"application/json",Authorization:"Bearer "+t},body:JSON.stringify({endpoint:s.endpoint})}).catch(()=>{});s.unsubscribe()}}).catch(()=>{});
 localStorage.removeItem("cal_tok");tok=null;loaded=false;S={done:{},tasks:{}};document.body.classList.add("out");showAuth("login")}
async function authCall(body){const e=$("#err");if(e)e.textContent="";
 try{const r=await fetch("/api/auth",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});const j=await r.json();
  if(!r.ok){if(e)e.textContent=j.error||"Something went wrong";return}
  tok=j.token;localStorage.setItem("cal_tok",tok);load()}catch(x){if(e)e.textContent="Network error. Please try again."}}
function showAuth(m){const a=$("#auth"),L=m==="login";
 a.innerHTML=`<div class="authcard glass"><div class="logo"><svg viewBox="0 0 24 24">${IC.year}</svg></div><h1>My Calendar</h1><p class="sub">${L?"Log in with your email to open your calendar":"Create your account with just your email"}</p><input id="em" type="email" placeholder="you@example.com" autocomplete="email"><div id="err"></div><button id="go" class="primary">${L?"Log in":"Sign up"}</button><div id="gbtn"></div><p class="alt">${L?"New here? <a id='sw'>Sign up as new</a>":"Already have an account? <a id='sw'>Log in</a>"}</p></div>`;
 const go=()=>authCall({mode:L?"login":"signup",email:$("#em").value});
 $("#go").onclick=go;$("#em").onkeydown=e=>{if(e.key==="Enter")go()};$("#sw").onclick=()=>showAuth(L?"signup":"login");
 setupGoogle(L)}
function setupGoogle(prompt=true){if(!gid||!window.google||!google.accounts)return;
 google.accounts.id.initialize({client_id:gid,callback:r=>authCall({credential:r.credential}),auto_select:false});
 const g=$("#gbtn");if(g)google.accounts.id.renderButton(g,{theme:"filled_black",size:"large",shape:"pill",width:Math.min(300,Math.floor(innerWidth*.92-60))});
 if(prompt)google.accounts.id.prompt()}
async function init(){if("serviceWorker" in navigator){navigator.serviceWorker.register("/sw.js").catch(()=>{});navigator.serviceWorker.addEventListener("message",e=>{if(e.data&&e.data.type==="play")playSound()})}
 try{const c=await (await fetch("/api/config")).json();gid=c.googleClientId||"";vapid=c.vapidPublicKey||""}catch(e){}
 if(tok)load();else showAuth("login")}

/* ---- reminders (web push) ---- */
const b64=s=>{const r=atob((s+"=".repeat((4-s.length%4)%4)).replace(/-/g,"+").replace(/_/g,"/"));return Uint8Array.from(r,c=>c.charCodeAt(0))};
const OK=[{t:"OK",v:0,c:"g"}];
function refreshBell(){const bb=document.querySelector("#bell");if(!bb||!navigator.serviceWorker)return;
 navigator.serviceWorker.getRegistration().then(r=>r&&r.pushManager.getSubscription()).then(s=>bb.classList.toggle("on",!!s)).catch(()=>{})}
async function ensureAlerts(manual){
 if(!("serviceWorker" in navigator)||!("PushManager" in window)||!("Notification" in window)||!vapid||!tok)return false;
 if(!manual&&localStorage.getItem("cal_alerts_off"))return false;
 let perm=Notification.permission;
 if(perm==="default")perm=await Notification.requestPermission();
 if(perm!=="granted")return false;
 try{const reg=await navigator.serviceWorker.register("/sw.js");await navigator.serviceWorker.ready;
  let sub=await reg.pushManager.getSubscription();
  if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64(vapid)});
  await fetch("/api/push",{method:"POST",headers:H(),body:JSON.stringify({sub:sub.toJSON(),tz:Intl.DateTimeFormat().resolvedOptions().timeZone})});
  localStorage.removeItem("cal_alerts_off");refreshBell();return true}catch(e){return false}}
function playSound(){const d=localStorage.getItem("cal_sound");if(!d)return;try{new Audio(d).play().catch(()=>{})}catch(e){}}
function pickSound(){return new Promise(res=>{const i=document.createElement("input");i.type="file";i.accept="audio/*";
 i.onchange=()=>{const f=i.files[0];if(!f)return res();
  if(f.size>900*1024){ask("This sound file is too large. Please choose a file under 900 KB.",OK).then(res);return}
  const r=new FileReader();r.onload=()=>{try{localStorage.setItem("cal_sound",r.result);playSound()}catch(e){ask("Could not save this sound.",OK)}res()};r.readAsDataURL(f)};
 i.click()})}
async function hasSub(){try{const r=await navigator.serviceWorker.getRegistration();return !!(r&&await r.pushManager.getSubscription())}catch(e){return false}}
async function alertsMenu(){
 if(!("serviceWorker" in navigator)||!("PushManager" in window))return ask("Notifications are not supported here. On iPhone, add this site to your Home Screen first, then open it from there.",OK);
 if(!vapid)return ask("Reminders are not set up on the server yet.",OK);
 for(;;){
  const on=await hasSub(),snd=!!localStorage.getItem("cal_sound");
  const o=[{t:on?"Turn off":"Turn on",v:"t",c:on?"r":"y"},{t:snd?"Change sound":"Choose sound",v:"c",c:"g"}];
  if(snd)o.push({t:"Play sound",v:"p",c:"g"},{t:"Reset sound",v:"r",c:"g"});o.push({t:"Close",v:null,c:"g"});
  const v=await ask(on?"Reminders are ON. You get a notification every 2 hours while today's tasks are not marked Right.":"Reminders are OFF.",o);
  if(v===null)return;
  if(v==="t"){
   if(on){const reg=await navigator.serviceWorker.getRegistration(),s=await reg.pushManager.getSubscription();
    await fetch("/api/push",{method:"DELETE",headers:H(),body:JSON.stringify({endpoint:s.endpoint})}).catch(()=>{});await s.unsubscribe();localStorage.setItem("cal_alerts_off","1");refreshBell()}
   else if(!(await ensureAlerts(true)))await ask("Could not turn on reminders. Please allow notifications for this site in your browser settings.",OK)}
  else if(v==="c")await pickSound();
  else if(v==="p")playSound();
  else if(v==="r")localStorage.removeItem("cal_sound")}}

/* ---- dialogs ---- */
function ask(msg,opts){return new Promise(res=>{const d=el("dialog");d.append(el("p","",msg));const r=el("div","row");
opts.forEach(o=>{const b=el("button",o.c||"",o.t);b.onclick=()=>{d.close();d.remove();res(o.v)};r.append(b)});d.append(r);
d.oncancel=()=>{d.remove();res(null)};document.body.append(d);d.showModal()})}

async function toggleDone(k){
 if(!S.done[k])S.done[k]=1;
 else if(await ask("Do you want to turn this day off?",[{t:"Yes",v:1,c:"y"},{t:"No",v:0,c:"g"}]))delete S.done[k];
 save();render()}

async function markTask(k,task){
 if(!task.s)task.s=1;
 else{const v=await ask("What would you like to do with this task?",[{t:task.s===1?"Keep Right":"Make Right",v:1,c:"y"},{t:task.s===2?"Keep Wrong":"Make Wrong",v:2,c:"r"},{t:"Remove",v:"del",c:"g"},{t:"Cancel",v:null,c:"g"}]);
  if(v===null)return;
  if(v==="del")S.tasks[k]=S.tasks[k].filter(x=>x.id!==task.id);else task.s=v}
 save();render()}

function taskPanel(box,k){
 box.innerHTML="";const list=S.tasks[k]||[];
 if(!list.length)box.append(el("div","empty","No tasks yet. Add your first one below."));
 list.forEach(t=>{const row=el("div","task s"+(t.s||0));row.append(el("div","t",t.text));
  const ok=el("button","mk"+(t.s?" on"+t.s:""));ok.setAttribute("aria-label","Mark task");ok.innerHTML=t.s===2?CROSS:TICK;
  ok.onclick=async()=>{await markTask(k,t);taskPanel(box,k)};row.append(ok);box.append(row)});
 const f=el("div","add"),i=el("input");i.placeholder="Write a new task";const b=el("button","addb","Add");
 const mic=el("button","mic");mic.type="button";mic.innerHTML=MIC+"<span>Speak</span>";
 const add=(txt,voice)=>{const v=(typeof txt==="string"?txt:i.value).trim();if(!v)return;(S.tasks[k]=S.tasks[k]||[]).push({id:Date.now()+Math.random(),text:v,s:0});save();if(k>=todayK)ensureAlerts(false);taskPanel(box,k);render();if(!voice)box.querySelector("input").focus()};
 b.onclick=()=>add();i.onkeydown=e=>{if(e.key==="Enter")add()};
 mic.onclick=()=>listen(mic,i,v=>add(v,true));
 f.append(i,mic,b);box.append(f)}

const TL_D={};for(const k in TL_RAW)TL_D[k.normalize("NFD")]=TL_RAW[k];
const TL_C={"क":"k","ख":"kh","ग":"g","घ":"gh","ङ":"n","च":"ch","छ":"chh","ज":"j","झ":"jh","ञ":"n","ट":"t","ठ":"th","ड":"d","ढ":"dh","ण":"n","त":"t","थ":"th","द":"d","ध":"dh","न":"n","प":"p","फ":"ph","ब":"b","भ":"bh","म":"m","य":"y","र":"r","ल":"l","ळ":"l","व":"v","श":"sh","ष":"sh","स":"s","ह":"h"};
const TL_N={"क":"q","ख":"kh","ग":"g","ज":"z","ड":"r","ढ":"rh","फ":"f"};
const TL_V={"अ":"a","आ":"aa","इ":"i","ई":"i","उ":"u","ऊ":"u","ऋ":"ri","ए":"e","ऐ":"ai","ओ":"o","औ":"au","ऑ":"o","ऍ":"e"};
const TL_M={"ा":"a","ि":"i","ी":"i","ु":"u","ू":"u","ृ":"ri","े":"e","ै":"ai","ो":"o","ौ":"au","ॉ":"o","ॅ":"e"};
function tlWord(w){
 w=w.normalize("NFD").replace(/ज्ञ/g,"ग्य");
 const L=tlLook(w);if(L)return L;
 const T=[];let i=0;
 while(i<w.length){const ch=w[i];
  if(TL_C[ch]){let r=TL_C[ch];i++;
   if(w[i]==="़"){r=TL_N[ch]||r;i++}
   const t={c:r,v:null,inh:false};
   if(TL_M[w[i]]){t.v=TL_M[w[i]];i++}else if(w[i]==="्"){i++}else t.inh=true;
   T.push(t)}
  else if(TL_V[ch]){T.push({c:"",v:TL_V[ch],inh:false});i++}
  else if(ch==="ं"||ch==="ँ"){T.push({c:"n",x:1});i++}
  else if(ch==="ः"){T.push({c:"h",x:1});i++}
  else if(ch>="०"&&ch<="९"){T.push({c:String(ch.charCodeAt(0)-0x966),x:2});i++}
  else i++}
 const has=t=>!!t&&!t.x&&(t.v!==null?t.v!=="":t.inh);
 let last=-1;for(let j=T.length-1;j>=0;j--)if(!T[j].x){last=j;break}
 for(let j=T.length-1;j>=0;j--){const t=T[j];if(!t.inh)continue;
  if(j===last&&j>0){t.inh=false;continue}
  if(j>0&&j<last&&has(T[j-1])&&has(T[j+1]))t.inh=false}
 let out="";
 T.forEach((t,j)=>{
  if(t.x===1&&t.c==="n"){const nx=T[j+1];out+=nx&&/^(p|b|m)/.test(nx.c||"")?"m":"n";return}
  if(t.x){out+=t.c;return}
  out+=t.c+(t.v!==null?t.v:(t.inh?"a":""))});
 return out}

const TL_S={};
function tlSk(w){
 w=w.normalize("NFD").replace(/\s+/g,"");
 w=w.replace(/[डढ]़/g,"र").replace(/[ऀ-ॿ]/g,c=>({"़":"","ं":"","ँ":"","ः":"","्":"","ी":"ि","ू":"ु","ै":"े","ौ":"ो","ॉ":"ो","ॅ":"े","ई":"इ","ऊ":"उ","ऐ":"ए","औ":"ओ","ऑ":"ओ","ऍ":"ए","ड":"र","ढ":"र","र":"र","ट":"त","ठ":"थ","ण":"न","श":"स","ष":"स","ळ":"ल"}[c]??c));
 return w.replace(/(.)\1+/g,"$1")}
(function(){
 const add=(v,r)=>{const e=v.replace(/\s+/g,"").normalize("NFD");if(!(e in TL_D))TL_D[e]=r;const k=tlSk(v);if(k.length>=3&&!(k in TL_S))TL_S[k]=r};
 for(const k in TL_RAW)add(k,TL_RAW[k]);
 TL_EXTRA.split("\n").forEach(l=>{const i=l.indexOf("=");if(i<1)return;const r=l.slice(0,i).trim();l.slice(i+1).split(",").forEach(v=>{v=v.trim();if(v)add(v,r)})})
})();
function tlLook(w){
 const e=w.replace(/\s+/g,"").normalize("NFD");if(TL_D[e])return TL_D[e];
 const k=tlSk(w);return k.length>=3&&TL_S[k]?TL_S[k]:null}
const DEV=/[ऀ-ॿ]/,DEVW=/^[ऀ-ॿ]+$/;
function tlText(s){
 const t=s.trim().split(/\s+/),out=[];
 for(let i=0;i<t.length;){
  if(DEVW.test(t[i])){
   let hit=null,n=0;
   for(const m of [3,2]){if(i+m<=t.length&&t.slice(i,i+m).every(x=>DEVW.test(x))){const L=tlLook(t.slice(i,i+m).join(""));if(L){hit=L;n=m;break}}}
   if(hit){out.push(hit);i+=n;continue}}
  out.push(DEV.test(t[i])?t[i].replace(/[ऀ-ॿ]+/g,tlWord):t[i]);i++}
 return out.join(" ").replace(/\s+/g," ").trim()}
function tlScore(s){return s.trim().split(/\s+/).filter(x=>DEVW.test(x)&&tlLook(x)).length}
function tlPick(res){let best=res[0].transcript,sc=-1;for(let j=0;j<res.length;j++){const c=tlScore(res[j].transcript);if(c>sc){sc=c;best=res[j].transcript}}return best}

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null;
function stopListen(){if(rec){rec._x=1;try{rec.abort()}catch(e){}rec=null}}
function listen(btn,input,done){
 if(!SR)return ask("Voice input is not supported in this browser. Please open the site in Chrome (Android or desktop).",OK);
 if(rec){try{rec.stop()}catch(e){}return}
 const r=new SR(),lab=btn.querySelector("span"),old=input.placeholder;let err="";
 rec=r;r.lang="hi-IN";r.interimResults=true;r.continuous=false;r.maxAlternatives=5;
 r.onstart=()=>{btn.classList.add("rec");lab.textContent="Listening… tap to stop";input.value="";input.placeholder="Speak your task now"};
 r.onresult=e=>{let t="";for(let j=0;j<e.results.length;j++)t+=tlPick(e.results[j])+" ";input.value=tlText(t)};
 r.onerror=e=>{err=e.error||"error"};
 r.onend=()=>{if(r._x)return;rec=null;btn.classList.remove("rec");lab.textContent="Speak";input.placeholder=old;
  const txt=input.value.trim();
  if(err==="not-allowed"||err==="service-not-allowed")return ask("Microphone access is blocked. Please allow the microphone for this site in your browser settings, then try again.",OK);
  if(err==="network")return ask("Voice recognition needs an internet connection.",OK);
  if(!txt){if(err==="no-speech"||!err)input.placeholder="Didn't catch that. Tap Speak and try again.";return}
  done(txt.charAt(0).toUpperCase()+txt.slice(1))};
 try{r.start()}catch(e){rec=null}}

function openDay(k){
 const [y,m,d]=k.split("-").map(Number),dt=new Date(y,m-1,d);
 const dlg=el("dialog"),h=el("p","",`${DF[dt.getDay()]}, ${d} ${MN[m-1]} ${y}`);if(dt.getDay()===0)h.className="sun";
 const box=el("div"),c=el("button","g","Close");c.style.marginTop="14px";c.onclick=()=>{dlg.close();dlg.remove()};
 dlg.append(h,box,c);dlg.onclose=()=>{stopListen();dlg.remove()};document.body.append(dlg);taskPanel(box,k);dlg.showModal()}

/* ---- views ---- */
function ring(k){const r=el("button","ring");r.innerHTML=TICK;r.setAttribute("aria-label","Mark day complete");r.onclick=e=>{e.stopPropagation();toggleDone(k)};return r}
function monthView(root){
 const mv=el("div","mview"),w=el("div","wk");DN.forEach(n=>w.append(el("div","",n)));mv.append(w);
 const g=el("div","grid"),y=cur.getFullYear(),m=cur.getMonth(),first=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate();
 for(let i=0;i<first;i++)g.append(el("div","cell blank"));
 for(let d=1;d<=n;d++){const dt=new Date(y,m,d),k=key(dt),c=el("div","cell"+(S.done[k]?" done":"")+(bad(k)?" bad":"")+(k===todayK?" today":""));
  c.tabIndex=0;const ct=el("div","ct");ct.append(el("span","n"+(dt.getDay()===0&&k!==todayK?" sun":""),d),ring(k));c.append(ct);
  const t=(S.tasks[k]||[]).length;if(t){const cn=el("span","cnt");cn.innerHTML="<b>"+t+"</b><em> task"+(t>1?"s":"")+"</em>";c.append(cn)}
  c.onclick=()=>openDay(k);c.onkeydown=e=>{if(e.key==="Enter")openDay(k)};g.append(c)}
 const rows=Math.ceil((first+n)/7);for(let i=first+n;i<rows*7;i++)g.append(el("div","cell blank"));
 g.style.setProperty("--rows",rows);
 mv.append(g);root.append(mv)}
function yearView(root){
 const wrap=el("div","year"),y=cur.getFullYear();
 for(let m=0;m<12;m++){const card=el("div","mini glass"),h=el("h4","",MN[m]);h.onclick=()=>{cur=new Date(y,m,1,12);view="month";render()};card.append(h);
  const g=el("div","grid");DN.forEach((n,i)=>g.append(el("span",i===0?"sun":"",n[0])));
  const first=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate();
  for(let i=0;i<first;i++)g.append(el("span"));
  for(let d=1;d<=n;d++){const dt=new Date(y,m,d),k=key(dt),s=el("span",(dt.getDay()===0?"sun ":"")+(S.done[k]?"done ":"")+(bad(k)?"bad":""),d);s.onclick=()=>openDay(k);g.append(s)}
  card.append(g);wrap.append(card)}
 root.append(wrap)}
function dayView(root){
 const k=key(cur),c=el("div","daycard glass"+(S.done[k]?" done":"")+(bad(k)?" bad":"")),h=el("div","dayhead"),t=el("div",cur.getDay()===0?"sun":"",`${cur.getDate()} ${MN[cur.getMonth()]} ${cur.getFullYear()}`);
 t.style.cssText="font-size:22px;font-weight:800";h.append(t,ring(k));
 const box=el("div");c.append(h,box);root.append(c);taskPanel(box,k)}

function render(){
 const b=$("#body");b.innerHTML="";b.classList.toggle("mv",view==="month");
 if(view==="year"){$("#lbl").textContent=cur.getFullYear();yearView(b)}
 else if(view==="month"){$("#lbl").textContent=MN[cur.getMonth()]+" "+cur.getFullYear();monthView(b)}
 else{$("#lbl").textContent=`${DF[cur.getDay()]}, ${cur.getDate()} ${MN[cur.getMonth()]} ${cur.getFullYear()}`;dayView(b)}
 document.querySelectorAll("#drawer [data-v]").forEach(x=>x.classList.toggle("on",x.dataset.v===view))}
function step(n){if(view==="year")cur.setFullYear(cur.getFullYear()+n);else if(view==="month"){cur.setDate(1);cur.setMonth(cur.getMonth()+n)}else cur.setDate(cur.getDate()+n);render()}
$("#prev").onclick=()=>step(-1);$("#next").onclick=()=>step(1);
